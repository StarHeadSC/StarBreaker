name: Release

# StarHeadSC fork: a `v*-sh.*` tag builds the Windows CLI and packs the Blender add-on of the
# same commit. Upstream's release also builds the signed Tauri app, which needs signing secrets
# this fork does not have, so that part is left out here.
on:
  push:
    tags:
      - "v*-sh.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Build CLI
        run: cargo build --release --locked --package starbreaker

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $info = @(
            "tag: $tag"
            "commit: ${{ github.sha }}"
            "starbreaker: $(& target/release/starbreaker.exe --version)"
            "rustc: $(rustc --version)"
          )
          New-Item -ItemType Directory dist, stage-cli, stage-addon | Out-Null

          Copy-Item target/release/starbreaker.exe, LICENSE stage-cli/
          $info | Set-Content stage-cli/BUILD-INFO.txt -Encoding utf8
          Compress-Archive -Path stage-cli/* -DestinationPath "dist/starbreaker-cli-$tag-windows-x86_64.zip"

          # The exporter puts this folder on Blender's sys.path, so the zip root holds starbreaker_addon/.
          Copy-Item -Recurse blender_addon/starbreaker_addon stage-addon/
          Copy-Item LICENSE stage-addon/
          $info | Set-Content stage-addon/BUILD-INFO.txt -Encoding utf8
          Compress-Archive -Path stage-addon/* -DestinationPath "dist/starbreaker-blender-addon-$tag.zip"

          Get-ChildItem dist/*.zip | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: StarBreaker ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            StarBreaker CLI for StarHead's data export, built from `${{ github.sha }}` on the `starhead` branch.
            It is upstream [diogotr7/StarBreaker](https://github.com/diogotr7/StarBreaker) plus the fixes listed in `STARHEAD.md`.

            - `starbreaker-cli-${{ github.ref_name }}-windows-x86_64.zip`: `starbreaker.exe`
            - `starbreaker-blender-addon-${{ github.ref_name }}.zip`: the Blender add-on of the same commit
            - `SHA256SUMS.txt`: checksums for the exporter's tool lock
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
